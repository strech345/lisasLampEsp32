; Rechnerspezifisches (upload_port, monitor_port …) gehört in platformio_override.ini
; (gitignored, Vorlage: platformio_override.example.ini). Fehlt die Datei, sucht PlatformIO den Port selbst.
[platformio]
extra_configs = platformio_override.ini

[env:esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
monitor_speed = 115200

debug_tool = esp-builtin
upload_protocol = esptool
upload_speed = 921600

board_build.f_cpu = 80000000L
board_build.filesystem = littlefs
board_build.data_dir = data
board_build.partitions = min_spiffs.csv

build_flags = 
  -DARDUINO_USB_CDC_ON_BOOT=0 ; disable intern jtag use rx tx (21,22)
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
  -DDEBUG



monitor_filters = 
    esp32_exception_decoder
    time      ; Add timestamp with milliseconds for each new line
    direct    ; Use direct for better performance with some adapters


; Exakt gepinnte Versionen (am Gerät getestet). Updates bewusst einzeln einspielen und testen —
; insbesondere AiEsp32RotaryEncoder: src/button.cpp verlässt sich auf deren Flanken-Zählung.
lib_deps = 
	kitesurfer1404/WS2812FX@1.4.7
	adafruit/Adafruit NeoPixel@1.15.5
	igorantolic/Ai Esp32 Rotary Encoder@1.7
	bblanchon/ArduinoJson@7.4.3
	mathieucarbou/AsyncTCP@3.3.2
	mathieucarbou/ESPAsyncWebServer@3.6.0
