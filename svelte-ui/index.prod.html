<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisa's Lamp</title>
    <link rel="stylesheet" href="/pico.min.css" />
    <style>html, body { overscroll-behavior: none; }</style>
  </head>
  <body>
    <div id="app"></div>
    <div id="err-banner" style="display:none;color:#fff;background:#c00;padding:8px;font-family:monospace;font-size:12px;position:fixed;bottom:0;left:0;right:0;z-index:9999;word-break:break-all;"></div>
    <script>
      window.onerror = function(msg, src, line) {
        var b = document.getElementById('err-banner');
        b.textContent = 'JS-Fehler: ' + msg + ' (Zeile ' + line + ')';
        b.style.display = 'block';
        return false;
      };
    </script>
    <script src="/app.js"></script>
  </body>
</html>
