; Rechnerspezifische PlatformIO-Einstellungen (Vorlage, eingecheckt).
; Nach platformio_override.ini kopieren und anpassen — diese Datei ist gitignored.
; Ports am besten über /dev/serial/by-id/ angeben, die Namen bleiben beim Umstecken gleich.

[env:esp32c3]
; USB-Anschluss des ESP32-C3 (zum Aufspielen)
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_XX:XX:XX:XX:XX:XX-if00
; Serieller Monitor, z. B. über einen FTDI-Adapter an TX/RX
monitor_port = /dev/serial/by-id/usb-FTDI_Single_RS232-HS-if00-port0
